name: CI

# This repo is a personal Emacs CONFIG, not a package.  Two things were
# wrong with the old workflow:
#
#   1. It built TDLib from source (~20 min of cmake) to validate elisp.
#      TDLib is a runtime binary that telega dlopens; nothing in this
#      config's elisp needs it to be compiled.
#   2. It ended with `emacs --batch --load init.el`, which cannot work:
#      the config is written for a GUI session and it loads sibling
#      checkouts (org-import, agent-org, ...) that do not exist on a
#      runner.  That step failed for reasons unrelated to the config's
#      correctness.
#
# What actually catches mistakes in a config is compiling it.  That is
# the gate now.  A runtime smoke load stays out of CI on purpose.
on:
  push:
    branches: [ai/main, main]
  pull_request:
    branches: [ai/main, main]
  workflow_dispatch: {}

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: purcell/setup-emacs@master
        with:
          version: 30.1
      - name: Install use-package
        run: |
          emacs -Q --batch \
            --eval '(progn
                      (require (quote package))
                      (setq package-archives
                            (quote (("gnu" . "https://elpa.gnu.org/packages/")
                                    ("melpa" . "https://melpa.org/packages/"))))
                      (package-initialize)
                      (package-refresh-contents)
                      (unless (package-installed-p (quote use-package))
                        (package-install (quote use-package))))'
      - name: Byte-compile every file
        run: |
          # Warnings are NOT fatal here: a config legitimately references
          # packages that are not installed on a runner.  Errors are.
          emacs -Q --batch --eval '(package-initialize)' \
            --eval '(setq byte-compile-error-on-warn nil)' \
            -f batch-byte-compile $(git ls-files '*.el')
      - name: Fail if any file failed to compile
        run: |
          missing=0
          for f in $(git ls-files '*.el'); do
            [ -f "${f}c" ] || { echo "did not compile: $f"; missing=1; }
          done
          test "$missing" -eq 0
